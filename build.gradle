plugins {
    id 'base'
    id 'org.openjfx.javafxplugin' version '0.1.0' apply false
    id 'org.springframework.boot' version '4.0.9' apply false
}

allprojects {
    group = 'com.quizai'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'

    repositories {
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:6.0.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    tasks.withType(ProcessResources).configureEach {
        exclude '**/.gitkeep'
    }
}

tasks.named('build') { dependsOn subprojects.collect { "${it.path}:build" } }
tasks.named('check') { dependsOn subprojects.collect { "${it.path}:check" } }
tasks.named('clean') { dependsOn subprojects.collect { "${it.path}:clean" } }
