plugins {
    id 'java-library'
}

// Only safe shared DTOs/enums belong here; no persistence or UI dependencies.
dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.21.7'
}

tasks.named('compileTestJava') {
    // Tests have no module-info and run on the classpath; an add-reads edge to
    // an unloaded application module is ineffective and produces a warning.
    options.compilerArgs += ['--add-modules', 'jdk.httpserver']
}
tasks.named('test') {
    jvmArgs '--add-modules', 'jdk.httpserver'
}
